<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2, #f7971e);
      background-size: 300% 300%;
      animation: gradientMove 8s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 90%;
    }

    .card h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .card p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      background: linear-gradient(45deg, #ff512f, #dd2476);
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">🚀 Under Construction</div>
    <h1>Coming Soon</h1>
    <p>We’re building something premium and powerful.  
       Stay tuned — it’s worth the wait.</p>
    <div class="footer">© 2026 • All Rights Reserved</div>
  </div>

</body>
</html>
